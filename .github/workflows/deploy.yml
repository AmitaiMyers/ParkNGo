name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Weekly rebuild so the parking data (from OpenStreetMap) stays fresh.
  schedule:
    - cron: '23 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build parking dataset (OpenStreetMap + curated list)
        run: npm run build:data

      - name: Build PWA
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility tests (mocked network)
        run: npm run e2e

      - name: Lighthouse (accessibility, best practices, SEO ≥ 95; performance reported)
        run: npm run lighthouse

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
